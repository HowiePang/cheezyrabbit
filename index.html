<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>cheezyrabbit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
</head>
<body>
<div id="app"></div>
<script>
    window.$docsify = {
        name: 'cheezyrabbit',
        repo: 'HowiePang/cheezyrabbit',
        loadSidebar: true,
        subMaxLevel:5,
        autoHeader:true,

        // afterRender：DOM已经渲染到真实页面，直接操作页面上真实img标签
        afterRender(vm) {
            const mdPath = vm.route.file;
            const depth = (mdPath.match(/\//g) || []).length;
            const prefix = "../".repeat(depth);

            // 获取页面渲染完成后真实的img节点，包含你写的原生html <img>
            document.querySelectorAll("#main img").forEach(img=>{
                let src = img.getAttribute("src");
                if (!src || src.startsWith("http")) return;

                if(src.startsWith("./assets/")){
                    const newSrc = prefix + src.replace(/^\.\//,"");
                    img.setAttribute("src", newSrc);
                }else if(src.startsWith("assets/")){
                    img.setAttribute("src", prefix + src);
                }
            })
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
