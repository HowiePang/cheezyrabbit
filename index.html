<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>cheezyrabbit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 缓存控制 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- themeable主题插件基础css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
    <!-- 侧边栏折叠样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css"/>

    <style>
        .sidebar-nav li.has-sub > ul {
            display: none !important;
        }
        .sidebar-nav li.has-sub.open > ul {
            display: block !important;
        }
    </style>
</head>
<body>
<div id="app"></div>
<script>

    window.$docsify = {
        name: 'cheezyrabbit',
        repo: 'HowiePang/cheezyrabbit',
        loadSidebar: true,
        sidebar: '/_sidebar.md',
        subMaxLevel: 3,
        autoHeader: true,
        // 主题切换按钮配置
        themeable: {
            dark: {
                ':root': {
                    '--theme-color': '#42b983'
                }
            }
        },

        plugins: [
            // 图片路径修复
            function fixImagePathPlugin(hook) {
                hook.afterEach(function (html) {
                    let hash = window.location.hash;
                    let path = hash.replace(/^#\//, '');
                    if (!path) return html;
                    path = path.split('?')[0];
                    const lastSlashPos = path.lastIndexOf('/');
                    let mdDir = '';
                    if (lastSlashPos > 0) {
                        mdDir = path.substring(0, lastSlashPos);
                    }
                    if (mdDir) {
                        const newPrefix = mdDir + '/assets/';
                        html = html.replace(/src="\.\/assets\//g, `src="${newPrefix}`);
                    }
                    return html;
                });
            },
            // 页面加载完成强制全部折叠侧边栏
            function forceAllCollapse(hook) {
                hook.doneEach(function () {
                    localStorage.removeItem('sidebar-collapse');
                    document.querySelectorAll('.sidebar-nav li.has-sub.open').forEach(el => {
                        el.classList.remove('open');
                    });
                })
            }
        ]
    }
</script>
<!-- docsify核心 -->
<script src="https://cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
<!-- 搜索插件 -->
<script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
<!-- 主题切换插件（必须放在docsify之后） -->
<script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
<!-- prismjs 语法高亮扩展 ini/bash/yaml/go/docker/json -->
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-ini.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
<!-- 侧边栏折叠JS -->
<script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
