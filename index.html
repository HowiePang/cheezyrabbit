<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>cheezyrabbit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 缓存控制 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
    <!-- 侧边栏折叠样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css"/>
    <style>
        .sidebar-nav li.has-sub > ul {
            display: none !important;
        }
        .sidebar-nav li.has-sub.open > ul {
            display: block !important;
        }
        /*====【新增：页脚样式｜优化美观版】====*/
        .my-docsify-footer {
            margin-top: 48px;   /* 原来80px，缩小和正文距离 */
            padding-top: 20px;
            padding-bottom:24px;
            border-top: 1px solid #eeeeee; /*变淡分割线，不刺眼 */
            color: #717171;
            font-size:13px;
            text-align:center;
        }
        .my-docsify-footer p {
            margin:6px 0;
        }
        .my-docsify-footer a{
            color:#3eaf7c; /*docsify主题绿色，和站点主题统一*/
            text-decoration:none;
            margin:0 6px;
        }
        .my-docsify-footer a:hover{
            text-decoration:underline;
        }
        /*====【新增结束】====*/

    </style>
</head>
<body>
<div id="app"></div>
<script>

    window.$docsify = {
        name: 'cheezyrabbit',
        repo: 'HowiePang/cheezyrabbit',
        loadSidebar: true,
        sidebar: '/_sidebar.md',
        subMaxLevel: 3,
        autoHeader: true,

        plugins: [
            /*====【新增：页脚插件，每渲染完md页面自动追加页脚到文章末尾】====*/
            function addFooterPlugin(hook){
                hook.doneEach(function(){
                    //清除旧页脚，防止重复
                    document.querySelectorAll('.my-docsify-footer').forEach(el=>el.remove());
                    const contentWrap = document.querySelector('.markdown-section');
                    if(!contentWrap) return;
                    const footerDiv = document.createElement('div');
                    footerDiv.className = "my-docsify-footer";
                    footerDiv.innerHTML = `
<p>© 2023-2026 cheezyrabbit</p>
<p>
    <a href="#/about_home.md">首页</a>
    <a href="#/about_author.md">关于作者</a>
    <a href="#/support.md">自愿捐赠</a>
    <a href="#/changelog.md">更新记录</a>
    <a target="_blank" href="https://github.com/HowiePang/cheezyrabbit">GitHub仓库</a>
</p>
        `;
                    contentWrap.appendChild(footerDiv);
                })
            },
            /*====结束====*/

            // 图片路径修复
            function fixImagePathPlugin(hook) {
                hook.afterEach(function (html) {
                    let hash = window.location.hash;
                    let path = hash.replace(/^#\//, '');
                    if (!path) return html;
                    path = path.split('?')[0];
                    const lastSlashPos = path.lastIndexOf('/');
                    let mdDir = '';
                    if (lastSlashPos > 0) {
                        mdDir = path.substring(0, lastSlashPos);
                    }
                    if (mdDir) {
                        const newPrefix = mdDir + '/assets/';
                        html = html.replace(/src="\.\/assets\//g, `src="${newPrefix}`);
                    }
                    return html;
                });
            },
            // 页面加载完成强制全部折叠侧边栏
            function forceAllCollapse(hook) {
                hook.doneEach(function () {
                    localStorage.removeItem('sidebar-collapse');
                    document.querySelectorAll('.sidebar-nav li.has-sub.open').forEach(el => {
                        el.classList.remove('open');
                    });
                })
            }
        ]
    }
</script>
<!-- docsify核心 -->
<script src="https://cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
<!-- 搜索插件 -->
<script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
<!-- prismjs 语法高亮扩展【解决ini/bash/yaml/go/docker 代码块无颜色】 -->
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-ini.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
<!-- 侧边栏折叠JS -->
<script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
